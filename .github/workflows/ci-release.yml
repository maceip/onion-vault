# OnionVault — continuous integration and release pipeline.
#
# Every push to *any* branch (and every manual run) executes the whole
# pipeline:
#
#   1. `rust-tests`    — fmt, clippy, check and test the Rust workspace,
#   2. `android-build` — Compose preview smoke test and debug APK assembly,
#   3. `release`       — publishes a *new* tagged GitHub Release with the APK.
#
# The `rust-tests` job does not need the CEF runtime: the vendored build
# scripts understand `ONIONVAULT_CEF_CHECK_ONLY=1`, which skips the CEF link
# step and the packaging of the CEF resources, while everything else is still
# type-checked, unit-tested and assembled into an APK.
#
# The `android-build` job builds the *real* APK: it downloads the CEF runtime
# for Android (Cefrium, the port of CEF to `aarch64-linux-android`, built on
# the same Chromium release as the CEF 156 bindings of this project), links
# the native library of OnionVault against it and packages the engine into
# the APK.
#
# The C++ wrapper (`libcef_dll_wrapper.a`) is not needed: the distribution
# ships a self-contained `libcef.so` that exports the whole C API.
#
# The release job publishes the APK of that build with its SHA-256 sum; every
# push gets its own tag (`build-<run number>-<commit>`), so no release ever
# overwrites the artefact of an earlier build.

name: CI & Release

on:
  # Any branch, any push.  A release is published for every one of them.
  - push
  - workflow_dispatch

permissions:
  # The release job needs to create tags and GitHub Releases.
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      # The CEF Android distribution cannot be obtained in CI, so the CEF
      # link/packaging step is switched off: the crates are still type-checked
      # and unit-tested against the CEF bindings.
      ONIONVAULT_CEF_CHECK_ONLY: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        # `rusqlite` is built with the `bundled` feature, i.e. SQLite is
        # compiled from C source and needs a C compiler.  `pkg-config` is the
        # conventional companion of the C/C++ build dependencies; `cmake` and
        # `ninja` are the toolchain the CEF wrapper is built with (not
        # exercised in check-only mode, but required if CEF is ever provided).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            ninja-build

      - name: Install the Rust toolchain
        # Pinned to the stable channel, including the two components the
        # pipeline needs: rustfmt (format check) and clippy (lints).
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the Cargo registry, the Cargo git checkouts and the target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # Deliberately *without* `-D warnings`: the CI must never require a
        # source change, it only reports the lints.
        run: cargo clippy --workspace --all-targets

      - name: Type-check the workspace
        run: cargo check --workspace

      - name: Run the workspace unit and integration tests
        # `cargo test --workspace` covers the unit tests of the workspace and
        # the integration tests in `crates/ov-pgp/tests` and
        # `crates/ov-tor/tests` (and those of `crates/ov-cef`).
        run: |
          set -o pipefail
          mkdir -p test-results
          cargo test --workspace -- --nocapture 2>&1 | tee test-results/cargo-test.log

      - name: Upload the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-output
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  android-build:
    name: Android debug build and Compose preview test
    runs-on: ubuntu-latest
    needs: rust-tests
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      # The root of the CEF runtime for Android.  The step below downloads the
      # engine and prepares this directory; the Gradle build links the native
      # library against it and packages it into the APK.
      CEF_ANDROID_ROOT: ${{ github.workspace }}/cef-runtime/root
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # `setup-gradle` provides the Gradle caches (~/.gradle/caches, the
        # wrapper distribution and the build cache) for the Gradle steps below.
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/settings.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Put the SDK tools on the path
        # The image of the runner already carries the Android SDK; the
        # command line tools are only added to the path here, because the
        # `android-actions/setup-android` action installs the `tools`
        # package that Google removed from the repository and therefore
        # fails with "Failed to find package 'tools'".
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "${sdk_root}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "${sdkmanager}" ]; then
            echo "::error::sdkmanager was not found in ${sdk_root}/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "${sdkmanager}")" >> "$GITHUB_PATH"
          echo "The command line tools of the SDK are ${sdkmanager}."

      - name: Install the Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install the Android NDK
        # NDK r27c, the version the Gradle build declares as `ndkVersion`.
        run: sdkmanager "ndk;27.2.12479018"

      - name: Accept the Android SDK licenses
        run: |
          # `yes` is killed by SIGPIPE as soon as sdkmanager exits, so the
          # pipeline is evaluated without `pipefail` here: only the exit code
          # of `sdkmanager` matters.
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null

      - name: Export the Android NDK location and its toolchain
        # `cc` does not find the compiler of the NDK on its own: without
        # these variables the build of `rusqlite` (the bundled SQLite is
        # compiled from C source) stops with "failed to find tool
        # aarch64-linux-android-clang".  The API level 29 is the one of the
        # `minSdk` of the application.
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ndk_root="${sdk_root}/ndk/27.2.12479018"
          ndk_bin="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${ndk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ndk_root}" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${ndk_bin}/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${ndk_bin}/aarch64-linux-android29-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${ndk_bin}/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ndk_bin}/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          ls -la "${ndk_bin}/aarch64-linux-android29-clang"

      - name: Prepare the Gradle wrapper
        run: chmod +x android/gradlew

      - name: Install the Rust toolchain and the Android target
        # The toolchain is installed even though the native step is skipped
        # above, so that the job also verifies that the cross compilation
        # setup is complete.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache the Cargo registry, the Cargo git checkouts and the target directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cargo-target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      - name: Download the CEF runtime for Android
        # Cefrium is the port of CEF to `aarch64-linux-android`; release
        # 0.19.0 is built on Chromium 156.0.8078.80, the Chromium release of
        # the CEF 156 bindings of this project.  The engine is inside the SDK
        # of the release and is unpacked into the sysroot that the build
        # scripts expect.
        #
        # The checksum is the one of the release; a download that differs
        # from it stops the build instead of being linked against.
        run: |
          set -euo pipefail
          mkdir -p cef-runtime
          curl -sSL --retry 3 --retry-delay 5 -o cef-runtime/cefrium-sdk.aar \
            "https://codeberg.org/cefrium/cef-android/releases/download/v0.19.0/cefrium-sdk-0.19.0.aar"
          echo "efb3f50dede4485215560455e16836671a7ebae32a35559bcfd4456d6667978b  cef-runtime/cefrium-sdk.aar" \
            | sha256sum --check --strict -
          unzip -q cef-runtime/cefrium-sdk.aar 'jni/arm64-v8a/libcef.so' 'assets/*' -d cef-runtime/unpacked
          mkdir -p "${CEF_ANDROID_ROOT}/lib" "${CEF_ANDROID_ROOT}/locales"
          cp cef-runtime/unpacked/jni/arm64-v8a/libcef.so "${CEF_ANDROID_ROOT}/lib/"
          # The asset manager renames the resource files; the original names
          # are restored, because Chromium reads them by name.
          for file in cef-runtime/unpacked/assets/*.pak* cef-runtime/unpacked/assets/icudtl.dat*; do
            cp "$file" "${CEF_ANDROID_ROOT}/$(basename "${file%+com.cefrium+}")"
          done
          cp cef-runtime/unpacked/assets/stored-locales/en-US.pak* "${CEF_ANDROID_ROOT}/locales/en-US.pak"
          ls -la "${CEF_ANDROID_ROOT}" "${CEF_ANDROID_ROOT}/lib"

      - name: Cross-compile the Rust crates for Android
        # The crates are type-checked for `aarch64-linux-android` with the
        # NDK toolchain of the job and the CEF runtime of the step above.
        run: |
          set -o pipefail
          mkdir -p test-results
          cargo check --workspace --target aarch64-linux-android 2>&1 | tee test-results/cargo-android-check.log

      - name: Run the Compose preview smoke test
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests 'dev.onionvault.OnionVaultPreviewsTest' --stacktrace

      - name: Assemble the debug APK
        # The native library is cross-compiled and linked against the engine
        # of the first step; the APK carries the engine, the native library
        # and the resource files of Chromium.
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Check the content of the APK
        # The APK without the engine would not start: the check fails the
        # build if one of the three parts is missing.
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          # The listing is taken once: a `grep` that stops early would
          # break the pipe of `unzip` and fail the step with `pipefail`.
          listing="$(unzip -l "$apk")"
          for entry in \
            "lib/arm64-v8a/libcef.so" \
            "lib/arm64-v8a/libonion_vault.so" \
            "assets/cef/icudtl.dat" \
            "assets/cef/resources.pak"; do
            if ! grep -qF -- "$entry" <<< "$listing"; then
              echo "::error::The APK does not contain $entry"
              exit 1
            fi
            echo "OK  $entry"
          done

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onionvault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Android unit test reports
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish the tagged GitHub release
    runs-on: ubuntu-latest
    needs: [rust-tests, android-build]
    timeout-minutes: 15
    permissions:
      # Creating a release means creating a tag and a release object.
      contents: write
      actions: read
    env:
      # A new tag for every push.  A re-run of the same push reuses the tag
      # of that run and updates the existing release instead of failing.
      RELEASE_TAG: build-${{ github.run_number }}-${{ github.sha }}
    steps:
      - name: Download the debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: onionvault-debug-apk
          path: dist

      - name: Compute the SHA-256 checksum of the APK
        id: apk
        run: |
          set -euo pipefail
          apk_path="$(find dist -type f -name '*.apk' -print -quit)"
          if [ -z "${apk_path}" ]; then
            echo "::error::No APK found in the onionvault-debug-apk artifact"
            exit 1
          fi
          sha256="$(sha256sum "${apk_path}" | cut -d' ' -f1)"
          echo "path=${apk_path}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "SHA-256 of ${apk_path}: ${sha256}"

      - name: Create or update the tagged GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail

          title="OnionVault debug build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})"

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            # The tag already exists: this is a re-run of the same push.  The
            # release is updated instead of failing.
            echo "Release ${RELEASE_TAG} already exists — updating it in place."
            gh release upload "${RELEASE_TAG}" "${APK_PATH}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            echo "Creating the new release ${RELEASE_TAG} at commit ${GITHUB_SHA}."
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --generate-notes \
              --latest \
              --prerelease=false \
              "${APK_PATH}"
          fi

          # Start from the auto-generated changelog and append the build
          # information.  Everything from the marker on is replaced, so an
          # update never duplicates the block.
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > release-body.md
          awk '/^<!-- onionvault-build-info -->$/ { exit } { print }' release-body.md > release-body.trimmed.md
          mv release-body.trimmed.md release-body.md
          {
            echo
            echo "<!-- onionvault-build-info -->"
            echo "### Build information"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo "| SHA-256 (\`app-debug.apk\`) | \`${APK_SHA256}\` |"
          } >> release-body.md

          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --notes-file release-body.md \
            --latest \
            --prerelease=false

      - name: Mark the release as latest and not as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_id="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true > /dev/null
          echo "Release ${RELEASE_TAG} is published as a non-prerelease and marked as latest."
