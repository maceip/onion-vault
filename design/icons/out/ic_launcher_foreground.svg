<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#241546"/>
      <stop offset="0.45" stop-color="#150E28"/>
      <stop offset="1" stop-color="#080A0F"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMagenta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C026D3" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#C026D3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#2DD4BF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.028"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="rimSoft" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.26"/>
    </linearGradient>
    <radialGradient id="streak" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coolGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="innerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E11" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0B0E11" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0B0E11" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="tabFill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="markFill" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F3E8FF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="markGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="caustic" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C026D3" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="favicon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="23.0" y="27.0" width="62.0" height="54.0" rx="18.0"/>
    </clipPath>
    <clipPath id="markClip">
      <path d="M54,28 C48,28 44,30 42,34 C34,40 29,49 29,59 C29,73 40,84 54,84 C68,84 79,73 79,59 C79,49 74,40 66,34 C64,30 60,28 54,28 Z" transform="translate(43.839 52.194) scale(0.1882)"/>
      <path d="M52.4,28.6 C49.6,21.6 52,13.4 58.4,9.6 C55.6,16 54.4,22.4 56.2,28.2 Z" transform="translate(43.839 52.194) scale(0.1882)"/>
    </clipPath>
  </defs>

  <g>
    <!-- the caustic light under the window -->
    <ellipse cx="54.00" cy="82.50" rx="26.04" ry="6.5"
             fill="url(#caustic)"/>

    <!-- the glass body of the window -->
    <rect x="23.0" y="27.0" width="62.0" height="54.0" rx="18.0" fill="url(#glass)"/>

    <!-- the specular light that makes the glass look wet -->
    <g clip-path="url(#windowClip)">
      <ellipse cx="37.88" cy="30.24" rx="28.52" ry="16.20"
               fill="url(#streak)" transform="rotate(-16 37.88 30.24)"/>
      <ellipse cx="77.56" cy="78.84" rx="22.32" ry="14.04"
               fill="url(#coolGlow)" transform="rotate(-16 77.56 78.84)"/>
      <!-- the hard glint of a wet surface -->
      <path d="M16.80 60.48 C32.92 36.72 44.08 28.08 63.92 23.76
               L54.00 28.08 C39.12 34.56 29.20 50.76 16.80 70.20 Z"
            fill="url(#glint)"/>
      <rect x="23.0" y="55.08" width="62.0" height="25.92" fill="url(#innerShade)"/>
    </g>

    <!-- the rim of the window: the bright edge of the glass -->
    <rect x="23.0" y="27.0" width="62.0" height="54.0" rx="18.0" fill="none"
          stroke="url(#rim)" stroke-width="1.8"/>

    <!-- the browser chrome -->
    <g>
      <!-- the active tab -->
      <rect x="30.5" y="30.5" width="34.0" height="13.0" rx="6.5"
            fill="url(#tabFill)" stroke="url(#rimSoft)" stroke-width="0.7"/>
      <circle cx="36.50" cy="37.00" r="2.4" fill="url(#favicon)"/>
      <rect x="43.50" y="35.80" width="13.0" height="2.0" rx="1.0"
            fill="#FFFFFF" fill-opacity="0.34"/>
      <path d="M57.90 35.10 L61.10 38.30
               M61.10 35.10 L57.90 38.30"
            stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="0.85" stroke-linecap="round"/>

      <!-- the button that opens a new tab -->
      <path d="M69.50 37.00 L74.50 37.00
               M72.00 34.50 L72.00 39.50"
            stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="1.1" stroke-linecap="round"/>

      <!-- the address bar -->
      <rect x="30.5" y="48.0" width="47.0" height="13.5" rx="6.75"
            fill="url(#barFill)" stroke="url(#rimSoft)" stroke-width="0.7"/>

      <!-- the padlock: the traffic never leaves the tunnel -->
      <rect x="36.00" y="54.60" width="6.2" height="5.4" rx="1.5"
            fill="#FFFFFF" fill-opacity="0.94"/>
      <path d="M37.30 54.60 v-1.5 a1.8 1.8 0 0 1 3.6 0 v1.5"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.94" stroke-width="1.25" stroke-linecap="round"/>

      <!-- the address of the hidden service -->
      <rect x="44.00" y="53.60" width="22.00" height="2.3" rx="1.15"
            fill="#FFFFFF" fill-opacity="0.32"/>

      <!-- the indicator that the tunnel is up -->
      <circle cx="71.00" cy="54.75" r="4.0" fill="#2DD4BF" fill-opacity="0.16"/>
      <circle cx="71.00" cy="54.75" r="2.1" fill="#2DD4BF" fill-opacity="0.92"/>
    </g>
  </g>
  <g>
    <!-- the glow of the mark -->
    <circle cx="54.00" cy="61.00" r="11.90" fill="url(#markGlow)"/>
    <g transform="translate(43.839 52.194) scale(0.1882)">
      <path d="M52.4,28.6 C49.6,21.6 52,13.4 58.4,9.6 C55.6,16 54.4,22.4 56.2,28.2 Z" fill="url(#markFill)"/>
      <path d="M54,28 C48,28 44,30 42,34 C34,40 29,49 29,59 C29,73 40,84 54,84 C68,84 79,73 79,59 C79,49 74,40 66,34 C64,30 60,28 54,28 Z" fill="url(#markFill)"/>
      <!-- the specular highlight of the glass -->
      <g clip-path="url(#markClip)">
        <ellipse cx="44" cy="38" rx="15" ry="8" fill="#FFFFFF" fill-opacity="0.5"
                 transform="rotate(-26 44 38)"/>
      </g>
      <path d="M54,55 m-5.2,0 a5.2,5.2 0 1,0 10.4,0 a5.2,5.2 0 1,0 -10.4,0" fill="#3B0F73"/>
      <path d="M51.4,59 h5.2 v13 h-5.2 z" fill="#3B0F73"/>
    </g>
  </g>
</svg>